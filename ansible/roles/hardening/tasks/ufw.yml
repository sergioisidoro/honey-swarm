---

# to verify ufw configuration run:
# sudo ufw status verbose

- name: Install ufw
  apt: package=ufw state=present

- name: Configure ufw incoming defaults to {{default_ufw_default_inbound_rule}}
  ufw: direction={{ item.direction }} policy={{ item.policy }}
  with_items:
    - { direction: 'incoming', policy: '{{default_ufw_default_inbound_rule}}' }
  notify:
    - restart ufw

- name: Configure ufw ougoing defaults to {{default_ufw_default_outbound_rule}}
  ufw: direction={{ item.direction }} policy={{ item.policy }}
  with_items:
    - { direction: 'outgoing', policy: '{{default_ufw_default_outbound_rule}}' }
  notify:
    - restart ufw

# These are VERY verbose, so that even if you decide to block outgoing traffic, things will still work.
- name: Configure ufw rules for SSH and basic services
  ufw: "{{item}}"
  with_items:
    - { rule: 'limit', port: '{{ ssh_port | default("22") }}', proto: 'tcp' }
    # BASIC SERVICES
    - { rule: 'allow', port: '50' }                       ## IP sec ESP
    - { rule: 'allow', port: '53' }                       ## For DNS
    - { rule: 'allow', port: 'http' }                     ## For HTTP
    - { rule: 'allow', port: 'https' }                    ## For HTTPS
  notify:
    - restart ufw

# Docker Swarm ports - restricted to cluster nodes only
# https://docs.docker.com/engine/swarm/swarm-tutorial/#open-protocols-and-ports-between-the-hosts
- name: Configure ufw rules for Docker Swarm ports (from cluster node public IPs)
  ufw:
    rule: allow
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto | default(omit) }}"
    from_ip: "{{ hostvars[item.0].ansible_host }}"
  loop: "{{ groups['nodes'] | product(docker_swarm_ports) | list }}"
  loop_control:
    label: "{{ item.1.port }} from {{ hostvars[item.0].ansible_host }}"
  notify:
    - restart ufw

- name: Configure ufw rules for Docker Swarm ports (from cluster node internal IPs)
  ufw:
    rule: allow
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto | default(omit) }}"
    from_ip: "{{ hostvars[item.0].dockerswarm_advertise_addr }}"
  loop: "{{ groups['nodes'] | product(docker_swarm_ports) | list }}"
  when: >
    hostvars[item.0].dockerswarm_advertise_addr is defined and
    hostvars[item.0].dockerswarm_advertise_addr != hostvars[item.0].ansible_host
  loop_control:
    label: "{{ item.1.port }} from {{ hostvars[item.0].dockerswarm_advertise_addr | default('N/A') }}"
  notify:
    - restart ufw

- name: Configure ufw rules for additional services if provided
  ufw: "{{item}}"
  with_items: "{{ ufw_extra_rules | default([]) }}"
  notify:
    - restart ufw

- name: Enable ufw logging
  ufw: logging=on
  notify:
    - restart ufw

- name: Enable ufw
  ufw: state=enabled
