---
###
# update-stacks playbook
##
# Re-deploys the critical core infrastructure stacks (Traefik + Portainer) so
# they pick up new image versions / config changes defined in this repo. The
# docker-stack role is idempotent and uses rolling update_config, so running
# this against a live cluster updates the services in place.
#
# Update everything:
#   ansible-playbook -i ansible/clusters/ENVIRONMENT ansible/04-update-stacks.yml
#
# Update just one component via tags:
#   ansible-playbook ... ansible/04-update-stacks.yml --tags stack-traefik
#   ansible-playbook ... ansible/04-update-stacks.yml --tags portainer
##

- hosts: dockerswarm_manager[0] # executed on the first Swarm manager
  pre_tasks:
    - name: Validate SSH access flags before touching the node
      ansible.builtin.import_tasks: tasks/assert-ssh-access.yml

    - name: Ensure the public-network overlay exists
      docker_network:
        name: public-network
        driver: overlay

  roles:
    # TRAEFIK
    - role: docker-stack
      tags:
        - stack-traefik
      vars:
        docker_stack_name: traefik

    # PORTAINER
    - role: docker-stack
      tags:
        - portainer
      vars:
        docker_stack_name: portainer
      # Upstream honey-swarm fixed the `deploly_portainer` typo. We accept both so
      # a cluster file (or an untracked *_overrides.yml) that still uses the old
      # spelling keeps working; prefer `deploy_portainer` in new configs.
      when: (deploy_portainer | default(deploly_portainer | default(true))) | bool
